name: Build and Deploy to CloudHub

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "8"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build Mule Application
        run: mvn -B clean package --file simple-mule-api/pom.xml -DskipTests

      - name: Find Artifact
        run: |
          artifactName=$(ls simple-mule-api/target/*.jar 2>/dev/null | head -n 1)
          if [ -z "$artifactName" ]; then
            echo "No jar found to deploy in simple-mule-api/target/"
            exit 1
          fi
          echo "Deploying Artifact: $artifactName"
          echo "artifactName=$artifactName" >> $GITHUB_ENV

      - name: Check Secrets
        run: |
          echo "Client ID length: ${#ANYPOINT_CLIENT_ID}"
          echo "Client Secret length: ${#ANYPOINT_CLIENT_SECRET}"

      - name: Deploy to CloudHub
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          mvn -B deploy \
            --file simple-mule-api/pom.xml \
            -DskipTests \
            -DmuleDeploy \
            -Dmule.artifact="${{ env.artifactName }}" \
            -DconnectedAppClientId="$ANYPOINT_CLIENT_ID" \
            -DconnectedAppClientSecret="$ANYPOINT_CLIENT_SECRET"
