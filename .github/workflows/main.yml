name: Build and Deploy to Sandbox

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v3

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up JDK 1.8
        uses: actions/setup-java@v3
        with:
          distribution: zulu
          java-version: 8

      - name: Build with Maven
        run: mvn -B clean package --file simple-mule-api/pom.xml

      - name: Stamp artifact file name with commit hash
        run: |
          artifactName1=$(ls simple-mule-api/target/*.jar 2>/dev/null | head -1)

          if [ -z "$artifactName1" ]; then
            echo "No JAR found inside simple-mule-api/target/"
            exit 1
          fi

          commitHash=$(git rev-parse --short "$GITHUB_SHA")
          artifactName2=$(echo "$artifactName1" | sed "s/.jar/-$commitHash.jar/g")

          mv "$artifactName1" "$artifactName2"
          echo "Renamed artifact: $artifactName2"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: simple-mule-api/target/*.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v3

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: artifacts
          path: target

      - name: Deploy to Sandbox (Connected App)
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
        run: |
          artifactName=$(ls target/*.jar 2>/dev/null | head -1)

          if [ -z "$artifactName" ]; then
            echo "No jar found to deploy in target/"
            exit 1
          fi

          if [ -z "$ANYPOINT_CLIENT_ID" ] || [ -z "$ANYPOINT_CLIENT_SECRET" ]; then
            echo "Missing ANYPOINT_CLIENT_ID or ANYPOINT_CLIENT_SECRET in GitHub Secrets!"
            exit 1
          fi

          mvn deploy \
            --file simple-mule-api/pom.xml \
            -DmuleDeploy \
            -Dmule.artifact="$artifactName" \
            -Danypoint.client_id="$ANYPOINT_CLIENT_ID" \
            -Danypoint.client_secret="$ANYPOINT_CLIENT_SECRET"
