name: Build and Deploy to Sandbox

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package --file simple-mule-api/pom.xml -DskipTests

      - name: Stamp artifact file name with commit hash
        run: |
          artifactName1=$(ls simple-mule-api/target/*.jar 2>/dev/null | head -1)

          if [ -z "$artifactName1" ]; then
            echo "No JAR found inside simple-mule-api/target/"
            exit 1
          fi

          commitHash=$(git rev-parse --short "$GITHUB_SHA")
          artifactName2=$(echo "$artifactName1" | sed "s/.jar/-$commitHash.jar/g")

          mv "$artifactName1" "$artifactName2"
          echo "Renamed artifact: $artifactName2"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mule-artifact
          path: simple-mule-api/target/*.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8
          cache: maven

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: mule-artifact
          path: simple-mule-api/target

      - name: Deploy to Sandbox (Connected App)
        env:
          ANYPOINT_CLIENT_ID: ${{ secrets.ANYPOINT_CLIENT_ID }}
          ANYPOINT_CLIENT_SECRET: ${{ secrets.ANYPOINT_CLIENT_SECRET }}
          ANYPOINT_ORG_ID: ${{ secrets.ANYPOINT_ORG_ID }}
          ANYPOINT_ENV: ${{ secrets.ANYPOINT_ENV }}
          CLOUDHUB_APP_NAME: ${{ secrets.CLOUDHUB_APP_NAME }}
          CLOUDHUB_REGION: ${{ secrets.CLOUDHUB_REGION }}
          CLOUDHUB_WORKERS: ${{ secrets.CLOUDHUB_WORKERS }}
          CLOUDHUB_WORKER_TYPE: ${{ secrets.CLOUDHUB_WORKER_TYPE }}
        run: |
          artifactName=$(ls simple-mule-api/target/*.jar 2>/dev/null | head -1)

          if [ -z "$artifactName" ]; then
            echo "No jar found to deploy in simple-mule-api/target/"
            exit 1
          fi

          echo "Deploying Artifact: $artifactName"

          mvn -B deploy \
            --file simple-mule-api/pom.xml \
            -DskipTests \
            -DmuleDeploy \
            -Dmule.artifact="$artifactName" \
            -Danypoint.client_id="$ANYPOINT_CLIENT_ID" \
            -Danypoint.client_secret="$ANYPOINT_CLIENT_SECRET" \
            -Danypoint.orgId="$ANYPOINT_ORG_ID" \
            -Danypoint.environment="$ANYPOINT_ENV" \
            -Dcloudhub.applicationName="$CLOUDHUB_APP_NAME" \
            -Dcloudhub.region="$CLOUDHUB_REGION" \
            -Dcloudhub.workers="$CLOUDHUB_WORKERS" \
            -Dcloudhub.workerType="$CLOUDHUB_WORKER_TYPE"
